name: hyper-hub-check

# B-01: CI untuk lapisan Hub dan overlay rebrand. Job ini sengaja terpisah dari
# `check.yml` upstream karena Hub memakai PowerShell 5.1 di Windows, sedangkan
# pemeriksaan TypeScript repo berjalan di Linux.

on:
  push:
    branches: [dev, hub-control-plane]
    paths:
      - "hub/**"
      - "rebrand/**"
      - ".github/workflows/hyper-hub-check.yml"
  pull_request:
    branches: [dev, hub-control-plane]
    paths:
      - "hub/**"
      - "rebrand/**"
      - ".github/workflows/hyper-hub-check.yml"
  workflow_dispatch:

jobs:
  hub:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: PowerShell 5.1 gates
        run: |
          $ErrorActionPreference = 'Stop'
          $checks = @(
            @('Hyper-Hub.ps1', 'self-check'),
            @('Hyper-Hub-SelfCheck.ps1'),
            @('Hyper-Hub-ContractCheck.ps1'),
            @('Hyper-Hub-SpecCheck.ps1', '-SelfCheck'),
            @('Hyper-Hub-VersionCheck.ps1', '-SelfCheck'),
            @('Hyper-Hub-Redaction.ps1', '-SelfCheck'),
            @('Hyper-Hub-Attachment.ps1', '-SelfCheck'),
            @('Hyper-Hub-Connector.ps1', '-SelfCheck'),
            @('Hyper-Hub-Policy.ps1', '-SelfCheck'),
            @('Hyper-Hub-Migrate.ps1', '-SelfCheck'),
            @('Hyper-Hub-AgentCheck.ps1', '-SelfCheck'),
            @('Hyper-Hub-AuditAnchor.ps1', '-SelfCheck'),
            @('Hyper-Hub-Approval.ps1', '-Action', 'self-check'),
            @('Hyper-Hub-SecurityCheck.ps1', '-SelfCheck'),
            @('Hyper-Hub-Sbom.ps1', '-SelfCheck'),
            @('Hyper-Hub-Jdih.ps1', '-SelfCheck'),
            @('Hyper-Hub-LoadCheck.ps1', '-SelfCheck'),
            @('Hyper-Hub-ContractVersion.ps1', '-SelfCheck'),
            @('Hyper-Hub-Recap.ps1', '-Sub', 'self-check'),
            @('Hyper-Hub-RunbookCheck.ps1', '-SelfCheck'),
            @('Hyper-Hub-Release.ps1', '-SelfCheck'),
            @('Hyper-Hub-Channel.ps1', '-SelfCheck'),
            @('Hyper-Hub-Hook.ps1', '-SelfCheck'),
            @('Hyper-Hub-NativeAdapter.ps1', '-SelfCheck'),
            @('Hyper-Hub-Acceptance.ps1', '-SelfCheck'),
            @('Hyper-Hub-Browser.ps1', '-SelfCheck'),
            @('Hyper-Hub-Download.ps1', '-SelfCheck'),
            @('Hyper-Hub-Provenance.ps1', '-SelfCheck'),
            @('Hyper-Hub-GraphBaseline.ps1', '-SelfCheck')
          )
          foreach ($check in $checks) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path 'hub' $check[0]) @($check | Select-Object -Skip 1)
            if ($LASTEXITCODE -ne 0) { throw "$($check[0]) exited $LASTEXITCODE" }
          }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"
      - name: CLI and knowledge checks
        run: |
          bun rebrand/test/fetch-idempotent.check.mjs
          bun rebrand/files/desktop/hyper/manifest-hash.check.ts
          bun rebrand/files/desktop/hyper/knowledge.test.ts
          bun rebrand/files/desktop/hyper/watcher.check.ts
      - name: Overlay tests
        run: bun rebrand/scripts/run-tests.ts
      - name: SBOM license gate
        working-directory: hub
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./Hyper-Hub-Sbom.ps1 -Root .. -OutDir sbom
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hyper-hub-sbom
          path: hub/sbom/
