name: hyper-config-release

# Config OTA: memvalidasi, menandatangani, dan menerbitkan bundle config Hyper AI.
# Berjalan terpisah dari rilis aplikasi: config bisa berubah tanpa install ulang.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel rilis
        type: choice
        options: [stable, beta, canary]
        default: stable
      version:
        description: Nomor versi bundle (harus naik; kosong = isi config/version)
        required: false
      rollout:
        description: Persentase rollout (0-100); manual boleh 100
        default: "100"
      min_app_version:
        description: Versi minimum aplikasi (kosong = tanpa batas)
        default: ""
  push:
    branches: [dev]
    paths:
      - "config/**"
      - ".github/workflows/hyper-config-release.yml"

permissions:
  contents: write

concurrency:
  group: hyper-config-${{ github.event.inputs.channel || 'stable' }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Lingkungan berproteksi: batasi siapa yang boleh menjalankan job yang memegang
    # CONFIG_SIGNING_KEY (Settings > Environments > config-release > required reviewers).
    environment: config-release
    env:
      CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
      VERSION: ${{ github.event.inputs.version || '' }}
      # Push ke dev memakai rollout kecil; naikkan manual setelah terverifikasi.
      ROLLOUT: ${{ github.event.inputs.rollout || '10' }}
      MIN_APP_VERSION: ${{ github.event.inputs.min_app_version || '' }}
      CONFIG_SIGNING_KEY: ${{ secrets.CONFIG_SIGNING_KEY }}
      CONFIG_ENROLLMENT_TOKEN: ${{ secrets.CONFIG_ENROLLMENT_TOKEN }}
      CONFIG_SECRETS_JSON: ${{ secrets.CONFIG_SECRETS_JSON }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Siapkan rahasia dari secret (bila ada)
        run: |
          set -euo pipefail
          if [ -n "${CONFIG_SECRETS_JSON:-}" ]; then
            printf '%s' "$CONFIG_SECRETS_JSON" > config/secrets.json
          fi
          if [ -f config/secrets.required ] && [ ! -f config/secrets.json ]; then
            echo "config/secrets.required ada, tetapi secret CONFIG_SECRETS_JSON kosong" >&2
            exit 1
          fi

      - name: Uji modul inti config OTA
        run: |
          node control/selftest.mjs
          node --import ./control/ts-resolve-register.mjs control/selftest-apply.mjs
          node control/selftest-pipeline.mjs

      - name: Tolak versi yang tidak naik
        run: |
          set -euo pipefail
          VERSION="${VERSION:-$(cat config/version)}"
          rm -rf /tmp/last && mkdir -p /tmp/last
          if gh release view "config-$CHANNEL" >/dev/null 2>&1; then
            gh release download "config-$CHANNEL" -p manifest.json -D /tmp/last
          fi
          if [ -f /tmp/last/manifest.json ]; then
            LAST=$(node -p "require('/tmp/last/manifest.json').version")
            if [ "$VERSION" -le "$LAST" ]; then
              echo "versi bundle $VERSION harus lebih besar dari $LAST" >&2
              exit 1
            fi
          fi

      - name: Bangun dan tanda tangani bundle
        run: |
          set -euo pipefail
          VERSION="${VERSION:-$(cat config/version)}"
          if [ ! -f config/opencode.json ]; then
            echo "config/opencode.json belum ada (salin dari config/opencode.example.json)" >&2
            exit 1
          fi
          ARGS=(--config config/opencode.json --version "$VERSION" --channel "$CHANNEL" --rollout "$ROLLOUT" --out "dist/config/$CHANNEL")
          if [ -n "$MIN_APP_VERSION" ]; then ARGS+=(--min-app-version "$MIN_APP_VERSION"); fi
          if [ -f config/secrets.json ]; then ARGS+=(--secrets config/secrets.json); fi
          node control/build-bundle.mjs "${ARGS[@]}"
          node control/verify-bundle.mjs "dist/config/$CHANNEL/bundle.json"

      - name: Terbitkan aset config (rolling release)
        run: |
          set -euo pipefail
          TAG="config-$CHANNEL"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Config $CHANNEL" --notes "Bundle config Hyper AI ($CHANNEL). Diperbarui otomatis oleh CI." --latest=false
          fi
          gh release upload "$TAG" "dist/config/$CHANNEL/bundle.json" "dist/config/$CHANNEL/bundle.json.sig" "dist/config/$CHANNEL/manifest.json" --clobber
          gh release edit "$TAG" --notes "Bundle config versi $(node -p "require('./dist/config/$CHANNEL/manifest.json').version") (channel $CHANNEL)."
